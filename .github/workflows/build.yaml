---
name: Build add-on

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck the entrypoint scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning paseo/rootfs/usr/local/bin/* paseo/rootfs/usr/local/sbin/*

      - name: Validate the add-on manifest
        uses: frenck/action-addon-linter@v2
        with:
          path: ./paseo

  # The image installs the newest release of every agent CLI and tool, so
  # "latest" is resolved here, once, and handed to both architecture legs. Left
  # to each leg, a release landing between the two would ship amd64 and aarch64
  # images of the same add-on version with different agent versions.
  resolve:
    name: Resolve latest versions
    runs-on: ubuntu-latest
    outputs:
      claude: ${{ steps.v.outputs.claude }}
      codex: ${{ steps.v.outputs.codex }}
      opencode: ${{ steps.v.outputs.opencode }}
      copilot: ${{ steps.v.outputs.copilot }}
      gemini: ${{ steps.v.outputs.gemini }}
      ha_cli: ${{ steps.v.outputs.ha_cli }}
      gh_cli: ${{ steps.v.outputs.gh_cli }}
    steps:
      - name: Resolve
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fail rather than fall back: a blank here would reach the Dockerfile
          # as an empty version and break the install in a less obvious place.
          put() {
            [[ -n "$2" && "$2" != "null" ]] || { echo "::error::could not resolve $1"; exit 1; }
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            echo "$1 $2"
          }
          put claude   "$(npm view @anthropic-ai/claude-code version)"
          put codex    "$(npm view @openai/codex version)"
          put opencode "$(npm view opencode-ai version)"
          put copilot  "$(npm view @github/copilot version)"
          put gemini   "$(npm view @google/gemini-cli version)"
          put ha_cli   "$(gh api repos/home-assistant/cli/releases/latest --jq .tag_name)"
          put gh_cli   "$(gh api repos/cli/cli/releases/latest --jq '.tag_name | ltrimstr("v")')"

  build:
    name: Build ${{ matrix.arch }}
    needs: [lint, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      # The tag is the source of truth for the version, NOT config.yaml.
      #
      # Supervisor reads config.yaml from the default branch and pulls
      # <image>:<that version>. If main advertises a version before the images
      # exist, every instance offers an update that fails with
      # "manifest unknown". So config.yaml is rewritten here in the workspace
      # (never committed at this point) and main is only bumped by the `bump`
      # job below, after both architectures have actually published.
      - name: Derive the add-on version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            # sed, not `yq -i`: yq rewrites the whole document and strips the
            # blank lines and formatting that make config.yaml readable.
            sed -i -E "s|^version: .*|version: \"${version}\"|" paseo/config.yaml
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            version="$(yq -r '.version' paseo/config.yaml)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building version ${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built with buildx rather than home-assistant/builder, which prints
      # "deprecated and no longer maintained" and unconditionally installs
      # cosign from sigstore -- a 503 there failed a release before any build
      # work had started. Pinning the action would not have helped: the cosign
      # install has no opt-out. The labels Supervisor reads are set here
      # explicitly instead, sourced from config.yaml so they cannot drift.
      - name: Build and publish
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
          CLAUDE_CODE_VERSION: ${{ needs.resolve.outputs.claude }}
          CODEX_VERSION: ${{ needs.resolve.outputs.codex }}
          OPENCODE_VERSION: ${{ needs.resolve.outputs.opencode }}
          COPILOT_VERSION: ${{ needs.resolve.outputs.copilot }}
          GEMINI_CLI_VERSION: ${{ needs.resolve.outputs.gemini }}
          HA_CLI_VERSION: ${{ needs.resolve.outputs.ha_cli }}
          GH_CLI_VERSION: ${{ needs.resolve.outputs.gh_cli }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64)   platform=linux/amd64 ;;
            aarch64) platform=linux/arm64 ;;
            *) echo "::error::unsupported arch ${ARCH}"; exit 1 ;;
          esac

          name="$(yq -r '.name' paseo/config.yaml)"
          description="$(yq -r '.description' paseo/config.yaml)"
          url="$(yq -r '.url' paseo/config.yaml)"
          image="ghcr.io/danielcbaldwin/ha-paseo-${ARCH}"

          # --pull and --no-cache so every build takes the current base image
          # digest and re-runs apt and npm, rather than reusing a layer that
          # froze whatever was newest the last time it was built.
          args=(
            --platform "$platform"
            --pull
            --no-cache
            --build-arg "BUILD_ARCH=${ARCH}"
            --build-arg "BUILD_VERSION=${VERSION}"
            --build-arg "CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION}"
            --build-arg "CODEX_VERSION=${CODEX_VERSION}"
            --build-arg "OPENCODE_VERSION=${OPENCODE_VERSION}"
            --build-arg "COPILOT_VERSION=${COPILOT_VERSION}"
            --build-arg "GEMINI_CLI_VERSION=${GEMINI_CLI_VERSION}"
            --build-arg "HA_CLI_VERSION=${HA_CLI_VERSION}"
            --build-arg "GH_CLI_VERSION=${GH_CLI_VERSION}"
            --label "io.hass.name=${name}"
            --label "io.hass.description=${description}"
            --label "io.hass.url=${url}"
            --label "io.hass.type=addon"
            --label "io.hass.arch=${ARCH}"
            --label "io.hass.version=${VERSION}"
            --label "org.opencontainers.image.source=${url}"
            --label "org.opencontainers.image.version=${VERSION}"
            --label "org.opencontainers.image.licenses=MIT"
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --tag "${image}:${VERSION}"
          )
          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--tag "${image}:latest" --push)
          else
            args+=(--load)
          fi

          docker buildx build "${args[@]}" paseo/

      # Supervisor refuses an add-on image without these, so a silent label
      # regression would only surface as a failed install on a real instance.
      - name: Verify the labels Supervisor requires
        if: ${{ steps.meta.outputs.publish == 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/danielcbaldwin/ha-paseo-${ARCH}:${VERSION}"
          labels="$(docker buildx imagetools inspect "$image" --format '{{json .Image}}' \
                    | jq -r '.. | .Labels? // empty | to_entries[] | "\(.key)=\(.value)"' | sort -u)"
          printf '%s\n' "$labels"
          for want in "io.hass.type=addon" "io.hass.arch=${ARCH}" "io.hass.version=${VERSION}"; do
            grep -qxF "$want" <<<"$labels" || { echo "::error::missing label ${want}"; exit 1; }
          done

  # Run the local integration harness against the image that was just published,
  # before anything advertises it.
  #
  # This gates `bump`, not the push, on purpose: an image sitting on GHCR is inert
  # until config.yaml names its version, so publishing first and verifying second
  # costs nothing and keeps the build job's single build-and-push intact. It earns
  # its keep on releases cut by upstream-release.yaml, where no human has looked at
  # the new base image -- verify.sh covers exactly what a base-image change breaks
  # (state landing on /data rather than the anonymous volume, the seeded config, the
  # entrypoint's connection modes, shims, services).
  #
  # amd64 only. aarch64 would need QEMU, and verify.sh boots the container a dozen
  # times over -- far too slow to sit in the release path.
  verify:
    name: Verify the published image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derived from the ref, not from a `build` job output: `build` is a matrix
      # and matrix outputs are last-writer-wins across legs. This job only runs
      # on tags, so the ref is authoritative -- same as the bump job below.
      - name: Run scripts/verify.sh against the published amd64 image
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          image="ghcr.io/danielcbaldwin/ha-paseo-amd64:${version}"
          docker pull "$image"
          ./scripts/verify.sh "$image"

  # Only now, with images on GHCR for every architecture and the harness green, is
  # it safe to tell Home Assistant a new version exists. Doing this before the
  # build is what produced "Can't install ...: [404] manifest unknown" on every
  # instance.
  bump:
    name: Advertise the published version
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point config.yaml at the published version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          current="$(yq -r '.version' paseo/config.yaml)"
          if [[ "$current" == "$version" ]]; then
            echo "main already advertises ${version}; nothing to do"
            exit 0
          fi
          sed -i -E "s|^version: .*|version: \"${version}\"|" paseo/config.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [skip ci] -- this commit changes only the advertised version, and
          # the images it points at were just built.
          git commit -am "Advertise add-on version ${version} [skip ci]"
          git push origin main
