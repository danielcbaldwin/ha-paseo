---
name: Build add-on

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck the entrypoint scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning paseo/rootfs/usr/local/bin/*

      - name: Validate the add-on manifest
        uses: frenck/action-addon-linter@v2
        with:
          path: ./paseo

  build:
    name: Build ${{ matrix.arch }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      # The tag is the source of truth for the version, NOT config.yaml.
      #
      # Supervisor reads config.yaml from the default branch and pulls
      # <image>:<that version>. If main advertises a version before the images
      # exist, every instance offers an update that fails with
      # "manifest unknown". So config.yaml is rewritten here in the workspace
      # (never committed at this point) and main is only bumped by the `bump`
      # job below, after both architectures have actually published.
      - name: Derive the add-on version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            yq -i ".version = \"${version}\"" paseo/config.yaml
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            version="$(yq -r '.version' paseo/config.yaml)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building version ${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The official builder emits the io.hass.* labels and the -{arch} image
      # naming Supervisor expects from a prebuilt add-on image.
      # --test builds without pushing; only tag pushes publish.
      - name: Build and publish
        uses: home-assistant/builder@master
        with:
          args: >-
            ${{ steps.meta.outputs.publish == 'true' && ' ' || '--test' }}
            --${{ matrix.arch }}
            --target /data/paseo
            --image ha-paseo-{arch}
            --docker-hub ghcr.io/danielcbaldwin
            --addon

  # Only now, with images on GHCR for every architecture, is it safe to tell
  # Home Assistant a new version exists. Doing this before the build is what
  # produced "Can't install ...: [404] manifest unknown" on every instance.
  bump:
    name: Advertise the published version
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point config.yaml at the published version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          current="$(yq -r '.version' paseo/config.yaml)"
          if [[ "$current" == "$version" ]]; then
            echo "main already advertises ${version}; nothing to do"
            exit 0
          fi
          yq -i ".version = \"${version}\"" paseo/config.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [skip ci] -- this commit changes only the advertised version, and
          # the images it points at were just built.
          git commit -am "Advertise add-on version ${version} [skip ci]"
          git push origin main
