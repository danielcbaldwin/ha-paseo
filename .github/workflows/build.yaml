---
name: Build add-on

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck the entrypoint scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning paseo/rootfs/usr/local/bin/*

      - name: Validate the add-on manifest
        uses: frenck/action-addon-linter@v2
        with:
          path: ./paseo

  build:
    name: Build ${{ matrix.arch }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Derive the add-on version
        id: meta
        run: |
          version="$(yq -r '.version' paseo/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Only tag pushes publish. Everything else is a build-only check.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "${tag_version}" != "${version}" ]]; then
              echo "::error::tag v${tag_version} does not match config.yaml version ${version}"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The official builder emits the io.hass.* labels and the -{arch} image
      # naming Supervisor expects from a prebuilt add-on image.
      # --test builds without pushing; only tag pushes publish.
      - name: Build and publish
        uses: home-assistant/builder@master
        with:
          args: >-
            ${{ steps.meta.outputs.publish == 'true' && ' ' || '--test' }}
            --${{ matrix.arch }}
            --target /data/paseo
            --image ha-paseo-{arch}
            --docker-hub ghcr.io/danielcbaldwin
            --addon
