---
# Pinned to an exact upstream release rather than `latest`. The add-on linter
# rejects digest references here (build_from must be a tag), so this is a tag --
# the digest it resolved to at the time is recorded below for audit:
#
#   0.11.2 -> sha256:ea6a922a7282d5368f7d0eae17caff6ce5ccde2bbac3f559c2e4c483d1cf2059
#
# Both architectures resolve from the same multi-arch index; the builder selects
# the right platform.
#
# These three lines are normally rewritten by .github/workflows/upstream-release.yaml
# when a new upstream tag appears -- it checks both platforms are present, records
# the digest, and cuts a release. Keep the comment's `<version> -> sha256:<digest>`
# shape: that workflow's sed patterns match on it. See DOCS.md, "Updating Paseo".
build_from:
  amd64: ghcr.io/getpaseo/paseo:0.11.2
  aarch64: ghcr.io/getpaseo/paseo:0.11.2

labels:
  org.opencontainers.image.source: https://github.com/danielcbaldwin/ha-paseo
  org.opencontainers.image.licenses: MIT
